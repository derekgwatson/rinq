name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for undefined names and syntax errors
        run: pipx run ruff check --select F821 rinq/

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    # do-rinq. Moved off do-personal (209.38.91.37) on 2026-11-01 — never
    # deploy there again: it would restart a stale copy of Tina.
    strategy:
      fail-fast: false
      matrix:
        host: [170.64.218.137]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.host }}
          username: derek
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: /var/www/rinq/deploy.sh
